<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Explorer - Giant Canvas</title>
    <link rel="stylesheet" href="styles.css">
    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Toolbar -->
        <div id="toolbar">
            <div class="group">
                <button id="loadFileBtn">📁 Load from Disk</button>
                <input type="file" id="fileInput" accept=".svg" hidden>
                <input type="text" id="urlInput" placeholder="Enter SVG URL...">
                <button id="loadUrlBtn">🌐 Load URL</button>
            </div>
            <div class="group">
                <button id="toggleGridBtn">📐 Toggle Grid</button>
                <span id="gridStatus">Off</span>
            </div>
            <div class="group">
                <span id="viewportInfo">View: 0, 0 | Zoom: 1.0x</span>
            </div>
            <div class="group">
                <button id="clearSelectionsBtn">🗑️ Clear Selections</button>
            </div>
        </div>

        <!-- Selection Panel -->
        <div id="selectionPanel">
            <h4>Selected Cells</h4>
            <div id="selectionList"></div>
            <div id="selectionPreview"></div>
        </div>

        <!-- p5 Canvas -->
        <div id="canvasContainer"></div>
    </div>

    <!-- TypeScript compiled output -->
    <script src="bundle.js"></script>
</body>
</html>
